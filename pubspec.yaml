name: giao_dien_1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  file_picker: ^10.2.0
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.5.3
  
flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/data/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/inter_18pt_regular.ttf
          weight: 100
        - asset: assets/font/inter_18pt_bold.ttf
          weight: 100
