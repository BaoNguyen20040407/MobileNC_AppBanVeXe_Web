name: giao_dien_1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  barcode: ^2.2.9
  file_picker: ^10.2.0
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  printing: ^5.14.2
  url_launcher: ^6.3.1
  http: ^0.13.6
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  qr_code_tools: ^0.2.0
  mobile_scanner: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.5.3
  
flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/data/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/inter_18pt_regular.ttf
          weight: 100
        - asset: assets/font/inter_18pt_bold.ttf
          weight: 100

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/iconappnamhai.png"
